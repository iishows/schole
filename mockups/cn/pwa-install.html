<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>小诺学伴 · 添加到主屏幕</title>
<style>
  :root {
    --primary: #722ed1; --primary-soft: #f3ebfd;
    --bg: #faf9fe; --surface: #fff;
    --fg: #1f1d2e; --muted: #6b6884; --line: #ece9f5;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, system-ui, sans-serif; background: var(--bg); color: var(--fg); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .anno { background: #fef3c7; border: 1px dashed #facc15; border-radius: 8px; padding: 8px 12px; font-size: 11px; color: #854d0e; margin-bottom: 12px; }
  .card { background: var(--surface); border-radius: 18px; padding: 32px 24px; max-width: 380px; width: 100%; box-shadow: 0 8px 32px rgba(114,46,209,0.08); text-align: center; }
  .logo { width: 80px; height: 80px; background: linear-gradient(135deg, var(--primary) 0%, #d946ef 100%); border-radius: 18px; margin: 0 auto 20px; display: flex; align-items: center; justify-content: center; font-size: 40px; }
  h1 { font-size: 22px; font-weight: 700; margin-bottom: 8px; }
  .sub { font-size: 14px; color: var(--muted); margin-bottom: 24px; }
  .steps { text-align: left; margin-bottom: 24px; }
  .step { display: flex; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .step:last-child { border-bottom: none; }
  .step-num { width: 24px; height: 24px; background: var(--primary-soft); color: var(--primary); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; flex-shrink: 0; }
  .step-text { font-size: 13px; line-height: 1.5; }
  .step-text strong { color: var(--primary); }
  .btn-primary { width: 100%; padding: 14px; background: var(--primary); color: #fff; border: none; border-radius: 12px; font-size: 15px; font-weight: 600; cursor: pointer; margin-bottom: 8px; }
  .btn-text { background: none; border: none; color: var(--muted); font-size: 13px; cursor: pointer; padding: 8px; }
</style>
</head>
<body>
<div>
  <div class="anno">📲 M1 · PWA 安装提示</div>
  <div class="card">
    <div class="logo">🏠</div>
    <h1>添加"小诺学伴"到主屏幕</h1>
    <p class="sub">像 App 一样使用，无需每次打开浏览器</p>
    <div class="steps">
      <div class="step"><div class="step-num">1</div><div class="step-text">点击浏览器底部分享按钮 <strong>📤</strong></div></div>
      <div class="step"><div class="step-num">2</div><div class="step-text">选择 <strong>"添加到主屏幕"</strong></div></div>
      <div class="step"><div class="step-num">3</div><div class="step-text">桌面出现 🏠 图标，点击即开</div></div>
    </div>
    <button class="btn-primary">📲 立即安装</button>
    <button class="btn-text">暂不安装，先用浏览器</button>
  </div>
</div>
</body>
</html>
