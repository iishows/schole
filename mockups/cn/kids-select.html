<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>小诺学伴 · 我的孩子（家长侧）</title>
<style>
  :root {
    --primary: #722ed1;
    --primary-soft: #f3ebfd;
    --bg: #faf9fe;
    --surface: #ffffff;
    --fg: #1f1d2e;
    --muted: #6b6884;
    --line: #ece9f5;
    --nunu: #722ed1;
    --nunu-soft: #f3ebfd;
    --hong: #ec4899;
    --hong-soft: #fce7f3;
    --aze: #f59e0b;
    --aze-soft: #fef3c7;
    --me: #3b82f6;
    --me-soft: #dbeafe;
    --success: #10b981;
    --success-soft: #d1fae5;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    background: var(--bg);
    color: var(--fg);
    font-size: 15px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    padding-bottom: 80px;
    min-height: 100vh;
  }

  /* Header */
  .header {
    background: var(--surface);
    padding: 20px;
    display: flex;
    align-items: center;
    gap: 12px;
    border-bottom: 1px solid var(--line);
  }
  .header-avatar {
    width: 44px; height: 44px;
    border-radius: 50%;
    background: var(--primary-soft);
    display: flex; align-items: center; justify-content: center;
    font-size: 22px;
    color: var(--primary);
    font-weight: 600;
  }
  .header-info { flex: 1; }
  .header-greeting {
    font-size: 13px; color: var(--muted);
  }
  .header-name {
    font-size: 17px; font-weight: 700;
    display: flex; align-items: center; gap: 6px;
  }
  .header-badge {
    padding: 2px 8px;
    background: var(--success-soft);
    color: var(--success);
    border-radius: 999px;
    font-size: 11px; font-weight: 600;
  }
  .header-action {
    padding: 8px 12px;
    background: var(--primary-soft);
    color: var(--primary);
    border-radius: 8px;
    font-size: 13px;
    font-weight: 600;
    text-decoration: none;
    cursor: pointer;
  }

  /* Main */
  .main {
    max-width: 720px;
    margin: 0 auto;
    padding: 18px 16px;
  }

  /* Annotation */
  .anno {
    background: linear-gradient(135deg, #fefce8 0%, #fef3c7 100%);
    border: 1px dashed #facc15;
    border-radius: 10px;
    padding: 10px 14px;
    font-size: 13px;
    color: #854d0e;
    display: flex; align-items: center; gap: 8px;
    margin-bottom: 16px;
  }
  .anno-icon {
    width: 22px; height: 22px;
    background: #facc15; color: #fff;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700;
    font-size: 12px;
    flex-shrink: 0;
  }

  /* Section title */
  .section-title {
    font-size: 14px;
    font-weight: 600;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 12px;
    padding: 0 4px;
    display: flex; align-items: center; gap: 8px;
  }
  .section-title .count {
    font-size: 12px;
    color: var(--muted);
    background: var(--line);
    padding: 2px 8px;
    border-radius: 999px;
  }

  /* Kid cards */
  .kid-list {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
    margin-bottom: 24px;
  }
  @media (max-width: 480px) {
    .kid-list { grid-template-columns: 1fr; }
  }

  .kid-card {
    background: var(--surface);
    border-radius: 16px;
    padding: 18px;
    border: 2px solid transparent;
    cursor: pointer;
    transition: all 0.2s;
    position: relative;
  }
  .kid-card:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(114, 46, 209, 0.08); }
  .kid-card.active {
    border-color: var(--primary);
    background: linear-gradient(135deg, var(--surface) 0%, var(--primary-soft) 100%);
  }
  .kid-avatar {
    width: 56px; height: 56px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 28px;
    margin-bottom: 10px;
  }
  .k12-avatar { background: var(--primary-soft); color: var(--primary); }
  .preschool-avatar { background: #fef3c7; color: #f59e0b; }

  .kid-name {
    font-size: 17px; font-weight: 700;
    margin-bottom: 2px;
  }
  .kid-meta {
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 12px;
  }
  .kid-tag {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 6px;
    font-size: 11px;
    font-weight: 600;
    margin-right: 4px;
  }
  .tag-k12 { background: var(--primary-soft); color: var(--primary); }
  .tag-preschool { background: var(--warn-soft); color: #92400e; }

  .kid-persona {
    display: flex; align-items: center; gap: 4px;
    margin-top: 10px;
    padding-top: 12px;
    border-top: 1px dashed var(--line);
  }
  .persona-mini {
    display: flex; align-items: center; gap: 4px;
    padding: 3px 8px;
    background: var(--bg);
    border-radius: 999px;
    font-size: 11px;
    font-weight: 500;
  }
  .persona-mini .dot {
    width: 16px; height: 16px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 10px;
  }
  .dot.mentor { background: var(--nunu-soft); color: var(--nunu); }
  .dot.buddy-h { background: var(--hong-soft); color: var(--hong); }
  .dot.buddy-a { background: var(--aze-soft); color: var(--aze); }

  .kid-active-badge {
    position: absolute;
    top: 12px; right: 12px;
    background: var(--primary);
    color: #fff;
    padding: 2px 8px;
    border-radius: 999px;
    font-size: 10px;
    font-weight: 700;
  }

  /* Add kid card */
  .kid-add {
    background: var(--surface);
    border: 2px dashed var(--line);
    border-radius: 16px;
    padding: 18px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    cursor: pointer;
    color: var(--muted);
    min-height: 180px;
    transition: all 0.2s;
  }
  .kid-add:hover { border-color: var(--primary); color: var(--primary); }
  .kid-add-icon {
    width: 56px; height: 56px;
    border-radius: 50%;
    background: var(--bg);
    display: flex; align-items: center; justify-content: center;
    font-size: 28px;
    margin-bottom: 10px;
  }
  .kid-add-title {
    font-size: 14px; font-weight: 600;
  }

  /* Subscription banner */
  .sub-banner {
    background: linear-gradient(135deg, var(--primary) 0%, #a855f7 100%);
    color: #fff;
    border-radius: 14px;
    padding: 16px 18px;
    display: flex; align-items: center; gap: 14px;
    margin-bottom: 16px;
  }
  .sub-icon { font-size: 28px; }
  .sub-content { flex: 1; }
  .sub-title { font-size: 15px; font-weight: 600; }
  .sub-detail {
    font-size: 12px;
    opacity: 0.9;
    margin-top: 2px;
  }
  .sub-btn {
    padding: 8px 14px;
    background: rgba(255,255,255,0.25);
    border: 1px solid rgba(255,255,255,0.4);
    color: #fff;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
  }

  /* Quick nav */
  .quick-nav {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    margin-bottom: 24px;
  }
  @media (max-width: 480px) {
    .quick-nav { grid-template-columns: repeat(2, 1fr); }
  }
  .nav-item {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 14px 8px;
    text-align: center;
    cursor: pointer;
    text-decoration: none;
    color: var(--fg);
  }
  .nav-item:hover { background: var(--primary-soft); }
  .nav-icon { font-size: 22px; margin-bottom: 4px; }
  .nav-label {
    font-size: 11px;
    font-weight: 500;
    color: var(--muted);
  }
</style>
</head>
<body>

<!-- Header -->
<div class="header">
  <div class="header-avatar">妈</div>
  <div class="header-info">
    <div class="header-greeting">晚上好</div>
    <div class="header-name">
      小诺妈妈
      <span class="header-badge">✓ 订阅中</span>
    </div>
  </div>
  <a class="header-action" href="#">⚙ 设置</a>
</div>

<!-- Main -->
<div class="main">

  <!-- Annotation -->
  <div class="anno">
    <div class="anno-icon">!</div>
    <div>
      <strong>核心场景</strong>：同家庭多孩——大宝 K12 模式（班主任"小诺姐姐"+ 同学）+ 二宝 学前模式（睡前故事）。1 个 App 管多孩，LTV 提升 25-49%。
    </div>
  </div>

  <!-- Subscription banner -->
  <div class="sub-banner">
    <div class="sub-icon">⭐</div>
    <div class="sub-content">
      <div class="sub-title">家庭版 ¥199/月</div>
      <div class="sub-detail">≤3 孩 · K12 + 学前混合 · 当前 2/3</div>
    </div>
    <button class="sub-btn">管理</button>
  </div>

  <!-- Section: My kids -->
  <div class="section-title">
    我的孩子
    <span class="count">2</span>
  </div>

  <div class="kid-list">

    <!-- Kid 1: K12 -->
    <div class="kid-card active">
      <div class="kid-active-badge">正在使用</div>
      <div class="kid-avatar k12-avatar">大</div>
      <div class="kid-name">大宝</div>
      <div class="kid-meta">
        10 岁 · 4 年级 · 人教版
      </div>
      <div>
        <span class="kid-tag tag-k12">K12 模式</span>
        <span class="kid-tag tag-k12">数学</span>
      </div>
      <div class="kid-persona">
        <div class="persona-mini">
          <span class="dot mentor">👩‍🏫</span>
          小诺姐姐
        </div>
        <div class="persona-mini">
          <span class="dot buddy-h">👧</span>
          小红
        </div>
        <div class="persona-mini">
          <span class="dot buddy-a">👦</span>
          阿泽
        </div>
      </div>
    </div>

    <!-- Kid 2: Preschool -->
    <div class="kid-card">
      <div class="kid-avatar preschool-avatar">二</div>
      <div class="kid-name">二宝</div>
      <div class="kid-meta">
        3 岁 · 学前
      </div>
      <div>
        <span class="kid-tag tag-preschool">学前模式</span>
        <span class="kid-tag tag-preschool">睡前故事</span>
      </div>
      <div class="kid-persona">
        <div class="persona-mini">
          <span class="dot mentor">📖</span>
          旁白姐姐
        </div>
        <div class="persona-mini">
          <span class="dot buddy-h">🐺</span>
          大灰狼
        </div>
      </div>
    </div>

    <!-- Add kid -->
    <div class="kid-add">
      <div class="kid-add-icon">+</div>
      <div class="kid-add-title">添加孩子</div>
    </div>

  </div>

  <!-- Section: Quick nav -->
  <div class="section-title">
    快速访问
  </div>

  <div class="quick-nav">
    <a class="nav-item" href="#">
      <div class="nav-icon">📊</div>
      <div class="nav-label">学习报告</div>
    </a>
    <a class="nav-item" href="#">
      <div class="nav-icon">📷</div>
      <div class="nav-label">拍照错题</div>
    </a>
    <a class="nav-item" href="#">
      <div class="nav-icon">📖</div>
      <div class="nav-label">睡前故事</div>
    </a>
    <a class="nav-item" href="#">
      <div class="nav-icon">⭐</div>
      <div class="nav-label">订阅管理</div>
    </a>
  </div>

</div>

</body>
</html>
