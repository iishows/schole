<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>小诺学伴 · 支付成功</title>
<style>
  :root {
    --primary: #722ed1; --primary-soft: #f3ebfd;
    --bg: #faf9fe; --surface: #fff;
    --fg: #1f1d2e; --muted: #6b6884; --line: #ece9f5;
    --success: #10b981; --success-soft: #d1fae5;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, system-ui, sans-serif; background: linear-gradient(135deg, var(--success-soft) 0%, var(--bg) 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .anno { background: #fef3c7; border: 1px dashed #facc15; border-radius: 8px; padding: 8px 12px; margin-bottom: 12px; font-size: 11px; color: #854d0e; }
  .card { background: var(--surface); border-radius: 20px; padding: 32px 24px; max-width: 400px; width: 100%; box-shadow: 0 8px 32px rgba(16,185,129,0.15); text-align: center; }
  .check-circle { width: 80px; height: 80px; background: var(--success); border-radius: 50%; margin: 0 auto 20px; display: flex; align-items: center; justify-content: center; font-size: 40px; color: #fff; animation: pop 0.4s ease-out; }
  @keyframes pop { 0% { transform: scale(0); } 80% { transform: scale(1.1); } 100% { transform: scale(1); } }
  h1 { font-size: 22px; font-weight: 700; margin-bottom: 8px; }
  .sub { font-size: 14px; color: var(--muted); margin-bottom: 24px; }
  .info-card { background: var(--bg); border-radius: 12px; padding: 16px; margin-bottom: 20px; text-align: left; }
  .info-row { display: flex; justify-content: space-between; padding: 8px 0; font-size: 13px; border-bottom: 1px dashed var(--line); }
  .info-row:last-child { border-bottom: none; }
  .info-label { color: var(--muted); }
  .info-value { font-weight: 600; }
  .info-value.big { font-size: 18px; color: var(--success); }
  .gift { background: linear-gradient(135deg, var(--primary-soft) 0%, #fce7f3 100%); border-radius: 12px; padding: 14px; margin-bottom: 20px; display: flex; align-items: center; gap: 10px; }
  .gift-icon { font-size: 28px; }
  .gift-text { flex: 1; font-size: 12px; color: #4c1d95; line-height: 1.6; }
  .gift-text strong { color: var(--primary); }
  .actions { display: flex; flex-direction: column; gap: 8px; }
  .btn { padding: 13px; border-radius: 10px; font-weight: 600; cursor: pointer; border: none; font-size: 14px; }
  .btn-primary { background: var(--primary); color: #fff; }
  .btn-secondary { background: var(--surface); color: var(--muted); border: 1px solid var(--line); }
  .footer { margin-top: 16px; font-size: 12px; color: var(--muted); }
</style>
</head>
<body>
<div>
  <div class="anno">✅ PAY-1 · M11 微信支付成功页 · 升级完成</div>
  <div class="card">
    <div class="check-circle">✓</div>
    <h1>支付成功 🎉</h1>
    <p class="sub">您的家庭版升级已完成</p>

    <div class="info-card">
      <div class="info-row"><span class="info-label">套餐</span><span class="info-value">家庭版 ¥1999/年</span></div>
      <div class="info-row"><span class="info-label">支付方式</span><span class="info-value">📱 微信支付</span></div>
      <div class="info-row"><span class="info-label">交易号</span><span class="info-value" style="font-family: monospace; font-size: 11px;">4200001234 20260825</span></div>
      <div class="info-row"><span class="info-label">生效时间</span><span class="info-value">2026-08-25 ~ 2027-08-25</span></div>
      <div class="info-row"><span class="info-label">已付金额</span><span class="info-value big">¥1940</span></div>
    </div>

    <div class="gift">
      <div class="gift-icon">🎁</div>
      <div class="gift-text">
        <strong>7 天内</strong> 添加第 2 个孩子，享受完整家庭版
      </div>
    </div>

    <div class="actions">
      <button class="btn btn-primary">➕ 添加第 2 个孩子</button>
      <button class="btn btn-secondary">📊 回到学习报告</button>
      <button class="btn btn-secondary">🏠 回主页</button>
    </div>

    <div class="footer">📧 发票将发送到 mama@example.com</div>
  </div>
</div>
</body>
</html>
