<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>小诺学伴 · 手动添加错题</title>
<style>
  :root {
    --primary: #722ed1; --primary-soft: #f3ebfd;
    --bg: #faf9fe; --surface: #fff;
    --fg: #1f1d2e; --muted: #6b6884; --line: #ece9f5;
    --success: #10b981; --danger: #dc2626;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, system-ui, sans-serif; background: var(--bg); padding-bottom: 80px; min-height: 100vh; }
  .topbar { background: var(--surface); padding: 14px 20px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 5; }
  .back { font-size: 20px; cursor: pointer; }
  .title { font-size: 16px; font-weight: 600; flex: 1; }
  .anno { background: #fef3c7; border: 1px dashed #facc15; border-radius: 8px; padding: 8px 12px; margin: 12px; font-size: 11px; color: #854d0e; }
  .main { max-width: 720px; margin: 0 auto; padding: 0 16px; }
  .card { background: var(--surface); border-radius: 14px; padding: 18px; margin-bottom: 12px; border: 1px solid var(--line); }
  .card-title { font-size: 14px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 12px; }
  .row { margin-bottom: 14px; }
  .row:last-child { margin-bottom: 0; }
  .label { display: block; font-size: 13px; font-weight: 500; margin-bottom: 6px; }
  .label .req { color: var(--danger); }
  .input, .textarea, .select { width: 100%; padding: 11px 14px; border: 1px solid var(--line); border-radius: 10px; font-size: 14.5px; background: var(--bg); outline: none; font-family: inherit; }
  .textarea { resize: vertical; min-height: 80px; line-height: 1.5; }
  .input:focus, .textarea:focus, .select:focus { border-color: var(--primary); background: var(--surface); }
  .row-2col { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .row-2col .input { background: var(--surface); text-align: center; font-weight: 600; color: var(--primary); }
  .fraction { display: inline-flex; flex-direction: column; align-items: center; vertical-align: middle; margin: 0 4px; }
  .fraction .num { border-bottom: 1px solid var(--fg); padding: 0 4px; }
  .fraction .den { padding: 0 4px; }
  .radio-row { display: flex; gap: 8px; }
  .radio-pill { flex: 1; padding: 10px; background: var(--bg); border: 2px solid var(--line); border-radius: 10px; text-align: center; cursor: pointer; font-size: 13px; }
  .radio-pill.active { border-color: var(--primary); background: var(--primary-soft); color: var(--primary); font-weight: 600; }
  .upload { border: 2px dashed var(--line); border-radius: 10px; padding: 20px; text-align: center; cursor: pointer; }
  .upload:hover { border-color: var(--primary); background: var(--primary-soft); }
  .upload-icon { font-size: 32px; margin-bottom: 4px; }
  .upload-text { font-size: 12px; color: var(--muted); }
  .bottom-bar { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(255,255,255,0.95); backdrop-filter: blur(10px); border-top: 1px solid var(--line); padding: 12px 20px; display: flex; gap: 10px; }
  .btn { flex: 1; padding: 12px; border-radius: 10px; font-weight: 600; cursor: pointer; border: none; font-size: 14px; }
  .btn-cancel { background: var(--bg); color: var(--muted); border: 1px solid var(--line); }
  .btn-primary { background: var(--primary); color: #fff; }
</style>
</head>
<body>
<div class="topbar">
  <span class="back">←</span>
  <span class="title">手动添加错题</span>
</div>

<div class="anno">📝 K-4 · M6 手动添加错题 · OCR 失败时使用</div>

<div class="main">
  <div class="card">
    <div class="card-title">① 错题信息</div>

    <div class="row">
      <label class="label">题目 <span class="req">*</span></label>
      <textarea class="textarea" placeholder="抄写题目文字，或描述题目内容...">小红有 1/2 个苹果，又买了 1/3 个，一共有多少个？</textarea>
    </div>

    <div class="row">
      <label class="label">题目图片（可选）</label>
      <div class="upload">
        <div class="upload-icon">📎</div>
        <div class="upload-text">点击上传图片 · 支持拍照 / 截图 / 手写</div>
      </div>
    </div>

    <div class="row">
      <label class="label">孩子答案 <span class="req">*</span></label>
      <input class="input" value="2/5" placeholder="孩子写的答案" />
    </div>

    <div class="row">
      <label class="label">正确答案 <span class="req">*</span></label>
      <input class="input" value="5/6" placeholder="正确答案" />
    </div>

    <div class="row">
      <label class="label">错误原因（可选）</label>
      <div class="radio-row">
        <div class="radio-pill">概念混淆</div>
        <div class="radio-pill active">粗心</div>
        <div class="radio-pill">计算错误</div>
        <div class="radio-pill">其他</div>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="card-title">② 章节分类</div>

    <div class="row">
      <label class="label">学科</label>
      <div class="radio-row">
        <div class="radio-pill active">数学</div>
        <div class="radio-pill">语文</div>
        <div class="radio-pill">英语</div>
      </div>
    </div>

    <div class="row">
      <label class="label">年级（按出生日期自动）</label>
      <div class="radio-row">
        <div class="radio-pill">1 年级</div>
        <div class="radio-pill">2 年级</div>
        <div class="radio-pill">3 年级</div>
        <div class="radio-pill active">4 年级</div>
      </div>
    </div>

    <div class="row">
      <label class="label">章节</label>
      <select class="select">
        <option>人教版 · 4 年级 · 数学</option>
        <option selected>4-NF-A-2 · 异分母分数加法（核心）</option>
        <option>4-NF-A-1 · 分数的意义</option>
        <option>4-NF-B-3 · 分数加减法</option>
        <option>4-MD-A-1 · 单位换算</option>
      </select>
    </div>
  </div>

  <div class="card">
    <div class="card-title">③ 接下来</div>
    <p style="font-size: 13px; color: var(--muted); line-height: 1.6;">
      提交后错题入库，可立即让 <strong>小诺姐姐</strong>讲解。
      错题将按艾宾浩斯曲线在 1/3/7/14 天后自动复习。
    </p>
  </div>
</div>

<div class="bottom-bar">
  <button class="btn btn-cancel">取消</button>
  <button class="btn btn-primary">✅ 提交入库</button>
</div>

</body>
</html>
