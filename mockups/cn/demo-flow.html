<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>小诺学伴 · CN SOP 流程演示</title>
<style>
  :root {
    --primary: #722ed1;
    --primary-soft: #f3ebfd;
    --bg: #0f0a1f;
    --surface: #1a1535;
    --surface-2: #221a3f;
    --fg: #f5f3ff;
    --muted: #a39fc0;
    --line: #2d2454;
    --success: #10b981;
    --warn: #f59e0b;
    --danger: #dc2626;
    --admin: #3b82f6;
    --nunu: #722ed1;
    --hong: #ec4899;
    --aze: #f59e0b;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    background: var(--bg);
    color: var(--fg);
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }

  /* App layout */
  .app {
    display: grid;
    grid-template-columns: 320px 1fr;
    grid-template-rows: 60px 1fr 60px;
    height: 100vh;
  }

  /* Header */
  .header {
    grid-column: 1 / -1;
    background: linear-gradient(90deg, var(--primary) 0%, #a855f7 100%);
    padding: 0 20px;
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .header-title {
    font-size: 16px;
    font-weight: 700;
  }
  .header-sub {
    font-size: 12px;
    opacity: 0.85;
  }
  .header-spacer { flex: 1; }
  .header-meta {
    font-size: 12px;
    background: rgba(255,255,255,0.15);
    padding: 4px 12px;
    border-radius: 999px;
    font-weight: 600;
  }
  .role-nav { display: flex; gap: 8px; }
  .role-nav a {
    padding: 4px 10px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 600;
    background: rgba(255,255,255,0.15);
    color: #fff;
    text-decoration: none;
    border: 1px solid rgba(255,255,255,0.2);
    transition: all 0.15s;
  }
  .role-nav a:hover {
    background: rgba(255,255,255,0.3);
  }
  .role-nav a.active {
    background: rgba(255,255,255,0.35);
    border-color: rgba(255,255,255,0.5);
  }

  /* Sidebar - SOP flow */
  .sidebar {
    background: var(--surface);
    border-right: 1px solid var(--line);
    overflow-y: auto;
    padding: 16px 12px;
  }
  .sidebar-title {
    font-size: 11px;
    font-weight: 700;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 12px;
    padding: 0 4px;
  }
  .sop-group {
    margin-bottom: 14px;
  }
  .sop-group-title {
    font-size: 11px;
    font-weight: 700;
    color: var(--primary);
    padding: 6px 8px;
    margin-bottom: 4px;
    border-left: 2px solid var(--primary);
  }
  .sop-group-title.admin {
    color: var(--admin);
    border-left-color: var(--admin);
  }
  .sop-list { display: flex; flex-direction: column; gap: 4px; }
  .sop-item {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 10px;
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.15s;
    color: var(--fg);
    border: 1px solid transparent;
    font-size: 12px;
  }
  .sop-item:hover {
    background: var(--surface-2);
  }
  .sop-item.active {
    background: linear-gradient(135deg, var(--primary) 0%, #a855f7 100%);
    color: #fff;
    border-color: rgba(255,255,255,0.2);
  }
  .sop-item.active.admin {
    background: linear-gradient(135deg, var(--admin) 0%, #1e40af 100%);
  }
  .sop-num {
    width: 20px; height: 20px;
    border-radius: 50%;
    background: rgba(255,255,255,0.1);
    display: flex; align-items: center; justify-content: center;
    font-size: 10px;
    font-weight: 700;
    flex-shrink: 0;
  }
  .sop-item.active .sop-num {
    background: rgba(255,255,255,0.3);
  }
  .sop-item.done .sop-num {
    background: var(--success);
    color: #fff;
  }
  .sop-info { flex: 1; min-width: 0; }
  .sop-name {
    font-size: 12px;
    font-weight: 500;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .sop-desc {
    font-size: 10px;
    opacity: 0.7;
    margin-top: 1px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* Main - iframe container */
  .main {
    background: #fff;
    position: relative;
    overflow: hidden;
  }
  .iframe-frame {
    width: 100%;
    height: 100%;
    border: none;
    background: #fff;
  }
  .iframe-overlay {
    position: absolute;
    top: 12px; left: 12px;
    background: rgba(15,10,31,0.85);
    backdrop-filter: blur(10px);
    color: #fff;
    padding: 6px 14px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 600;
    pointer-events: none;
    z-index: 10;
    display: flex; align-items: center; gap: 8px;
  }
  .overlay-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--danger);
    animation: pulse 1.5s infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  /* Bottom controls */
  .controls {
    grid-column: 1 / -1;
    background: var(--surface);
    border-top: 1px solid var(--line);
    padding: 0 20px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .ctrl-btn {
    padding: 8px 14px;
    background: var(--surface-2);
    color: var(--fg);
    border: 1px solid var(--line);
    border-radius: 8px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
  }
  .ctrl-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .ctrl-btn-primary {
    background: var(--primary);
    color: #fff;
    border-color: var(--primary);
  }
  .ctrl-progress {
    flex: 1;
    display: flex; align-items: center; gap: 12px;
  }
  .ctrl-progress-bar {
    flex: 1;
    height: 6px;
    background: var(--surface-2);
    border-radius: 3px;
    overflow: hidden;
  }
  .ctrl-progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--primary) 0%, #a855f7 100%);
    transition: width 0.3s;
  }
  .ctrl-progress-text {
    font-size: 12px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }
  .ctrl-time {
    font-size: 12px;
    color: var(--muted);
    font-family: monospace;
    font-variant-numeric: tabular-nums;
    min-width: 60px;
  }
  .ctrl-speed {
    padding: 6px 10px;
    background: var(--surface-2);
    color: var(--fg);
    border: 1px solid var(--line);
    border-radius: 6px;
    font-size: 12px;
    cursor: pointer;
  }
</style>
</head>
<body>

<div class="app">

  <!-- Header -->
  <div class="header">
    <div class="header-title">🎬 小诺学伴 · CN SOP 流程演示</div>
    <div class="header-sub" id="headerSub">30 mockup · 18 SOP · 自动播放</div>
    <div class="role-nav">
      <a href="./demo-flow.html" class="active">🌐 全部 30</a>
      <a href="./demo-flow-parent.html">👨‍👩‍👧 家长</a>
      <a href="./demo-flow-child.html">🧒 孩子</a>
      <a href="./demo-flow-admin.html">⚙️ 管理员</a>
      <a href="./demo-flow-support.html">🛡️ 客服</a>
      <a href="./demo-flow-classroom.html">🎓 Classroom</a>
    </div>
    <div class="header-spacer"></div>
    <div class="header-meta" id="autoBadge">▶ 自动播放</div>
  </div>

  <!-- Sidebar: SOP flow -->
  <div class="sidebar">
    <div class="sidebar-title">SOP 流程</div>
    <div id="sopList">
      <!-- dynamically generated by group -->
    </div>
  </div>

  <!-- Main: iframe -->
  <div class="main">
    <div class="iframe-overlay">
      <span class="overlay-dot"></span>
      <span id="overlayText">录制中 · SOP 1 访客</span>
    </div>
    <iframe class="iframe-frame" id="frame" src=""></iframe>
  </div>

  <!-- Controls -->
  <div class="controls">
    <button class="ctrl-btn" id="prevBtn">← 上一步</button>
    <button class="ctrl-btn ctrl-btn-primary" id="playBtn">⏸ 暂停</button>
    <button class="ctrl-btn" id="nextBtn">下一步 →</button>
    <div class="ctrl-progress">
      <div class="ctrl-progress-bar">
        <div class="ctrl-progress-fill" id="progressFill" style="width: 0%;"></div>
      </div>
      <div class="ctrl-progress-text" id="progressText">1 / 30</div>
    </div>
    <div class="ctrl-time" id="timeText">00:00</div>
    <select class="ctrl-speed" id="speedSelect">
      <option value="2000">⚡ 2s/页</option>
      <option value="3000">⚡ 3s/页</option>
      <option value="5000" selected>⏱ 5s/页</option>
      <option value="8000">🐢 8s/页</option>
    </select>
  </div>

</div>

<script>
// SOP flow definition - 30 步骤，按用户旅程分组
const flow = [
  // ===== Onboarding 新用户首次进入 =====
  { id: 1, sop: 'SOP 1 访客', group: '用户旅程 · 首次接触', file: 'landing-h5.html', name: '访客 H5 落地页', desc: '未注册首次进入', stepDur: 5000 },
  { id: 2, sop: 'M1 PWA 安装', group: '用户旅程 · 首次接触', file: 'pwa-install.html', name: 'PWA 安装提示', desc: '添加主屏幕', stepDur: 4000 },
  { id: 3, sop: 'M2 注册登录', group: '用户旅程 · 首次接触', file: 'register-login.html', name: '注册登录', desc: '手机号 + 微信', stepDur: 5000 },
  { id: 4, sop: 'M12 PIPL 同意', group: '用户旅程 · 首次接触', file: 'pipl-consent.html', name: 'PIPL 4 项同意', desc: '必勾选 + 未成年独立', stepDur: 5000 },
  { id: 5, sop: 'P-2 多孩选择', group: '用户旅程 · 首次接触', file: 'kids-select.html', name: '添加孩子', desc: 'Onboarding 孩子选择', stepDur: 5000 },

  // ===== 核心对话 =====
  { id: 6, sop: '核心 K-5', group: '核心对话 · 错题讲解', file: 'socratic-dialogue.html', name: 'Socratic 对话核心', desc: '1 mentor + 2 buddies', stepDur: 7000 },
  { id: 7, sop: 'M6 错题本', group: '核心对话 · 错题讲解', file: 'mistake-list.html', name: '错题本列表', desc: '状态筛选 + 艾宾浩斯', stepDur: 5000 },
  { id: 8, sop: 'M6 拍照 OCR', group: '核心对话 · 错题讲解', file: 'mistake-camera.html', name: '拍照 OCR', desc: '取景框 + 学科识别', stepDur: 5000 },
  { id: 9, sop: 'M6 手动添加', group: '核心对话 · 错题讲解', file: 'mistake-manual.html', name: '手动添加错题', desc: '表单 + 3 入口', stepDur: 5000 },
  { id: 10, sop: 'K-6 错题详情', group: '核心对话 · 错题讲解', file: 'mistake-detail.html', name: '错题详情', desc: '时间线 + Socratic 历史', stepDur: 7000 },

  // ===== 复习 =====
  { id: 11, sop: 'M9 复习队列', group: '复习 · 艾宾浩斯', file: 'review-queue.html', name: '艾宾浩斯复习', desc: '1/3/7/14/30 天', stepDur: 5000 },
  { id: 12, sop: '家长看周报', group: '复习 · 艾宾浩斯', file: 'learning-report.html', name: '本周学习报告', desc: '3 卡片周报', stepDur: 5000 },

  // ===== 订阅管理 =====
  { id: 13, sop: 'M11 支付成功', group: '订阅管理 · 付费', file: 'payment-success.html', name: '支付成功', desc: '微信支付 V3', stepDur: 4000 },
  { id: 14, sop: 'SOP 2 多孩管理', group: '订阅管理 · 付费', file: 'add-kid.html', name: '添加第 2 个孩子', desc: '套餐检查', stepDur: 5000 },
  { id: 15, sop: 'SOP 3 升级家庭版', group: '订阅管理 · 付费', file: 'upgrade-family.html', name: '升级家庭版', desc: '单孩 → 家庭版', stepDur: 5000 },

  // ===== 设置管理 =====
  { id: 16, sop: 'SOP 7 修改 persona', group: '设置管理 · 用户', file: 'swap-persona.html', name: '换班主任', desc: '锁定 100 天', stepDur: 5000 },
  { id: 17, sop: 'SOP 6 推送设置', group: '设置管理 · 用户', file: 'notification-prefs.html', name: '推送设置', desc: '静默时段', stepDur: 5000 },
  { id: 18, sop: 'SOP 5 账号安全', group: '设置管理 · 用户', file: 'account-security.html', name: '账号安全', desc: '密码 + 2FA', stepDur: 5000 },
  { id: 19, sop: 'SOP 8 PIPL 数据', group: '设置管理 · 用户', file: 'pipl-data.html', name: 'PIPL 数据权利', desc: '导出/删除/限制', stepDur: 5000 },

  // ===== 退订 / 客服 =====
  { id: 20, sop: 'SOP 4 退订', group: '退订 / 客服', file: 'subscription-cancel.html', name: '取消订阅', desc: '退订保留 30 天', stepDur: 5000 },
  { id: 21, sop: 'SOP 9 投诉', group: '退订 / 客服', file: 'complaint.html', name: '投诉/申诉', desc: 'SLA 24/48/72h', stepDur: 5000 },
  { id: 22, sop: 'SOP 10 未成年保护', group: '退订 / 客服', file: 'minor-protection.html', name: '时长保护', desc: '≤60min + 夜间禁用', stepDur: 5000 },

  // ===== 通用 =====
  { id: 23, sop: '通用错误页', group: '通用', file: '404.html', name: '404 错误页', desc: '返回首页', stepDur: 4000 },

  // ===== 管理员端（深色专业） =====
  { id: 24, sop: 'O-1 管理员登录', group: '管理员端 · 后台', file: 'admin-login.html', name: '管理员登录', desc: '邮箱 + 2FA', isAdmin: true, stepDur: 4000 },
  { id: 25, sop: 'O-7 数据看板', group: '管理员端 · 后台', file: 'admin-dashboard.html', name: '数据看板', desc: 'KPI + 7 日图表', isAdmin: true, stepDur: 6000 },
  { id: 26, sop: 'O-2 内容审核', group: '管理员端 · 后台', file: 'admin-review.html', name: '内容审核', desc: '待审队列 + 危险词', isAdmin: true, stepDur: 6000 },
  { id: 27, sop: 'O-3 用户管理', group: '管理员端 · 后台', file: 'admin-users.html', name: '用户管理', desc: '查询 + 停用 + 退款', isAdmin: true, stepDur: 5000 },
  { id: 28, sop: 'O-4 Persona 管理', group: '管理员端 · 后台', file: 'admin-personas.html', name: 'Persona CRUD', desc: '班主任模板管理', isAdmin: true, stepDur: 5000 },
  { id: 29, sop: 'O-5 Textbook 管理', group: '管理员端 · 后台', file: 'admin-textbooks.html', name: 'Textbook 管理', desc: 'PDF 上传 + 解析', isAdmin: true, stepDur: 5000 },
  { id: 30, sop: 'O-6 推送模板', group: '管理员端 · 后台', file: 'admin-templates.html', name: '推送模板编辑器', desc: '微信模板消息', isAdmin: true, stepDur: 6000 },
];

let DEFAULT_STEP_DUR = 5000;
let currentStep = 0;
let playing = true;
let stepStartTime = 0;
let stepTimer = null;

// Group flow by category
function groupFlow(flow) {
  const groups = {};
  flow.forEach((item, idx) => {
    const g = item.group || '其他';
    if (!groups[g]) groups[g] = [];
    groups[g].push({ ...item, flowIdx: idx });
  });
  return groups;
}

// Render sidebar with group titles
function renderSidebar() {
  const container = document.getElementById('sopList');
  const groups = groupFlow(flow);

  let html = '';
  Object.entries(groups).forEach(([groupName, items]) => {
    const isAdminGroup = groupName.includes('管理员');
    html += `<div class="sop-group">`;
    html += `<div class="sop-group-title ${isAdminGroup ? 'admin' : ''}">${groupName}</div>`;
    html += `<div class="sop-list">`;
    items.forEach(item => {
      const idx = item.flowIdx;
      const activeClass = idx === currentStep ? 'active' + (item.isAdmin ? ' admin' : '') : '';
      const doneClass = idx < currentStep ? 'done' : '';
      html += `
        <div class="sop-item ${activeClass} ${doneClass}" data-idx="${idx}">
          <div class="sop-num">${item.id}</div>
          <div class="sop-info">
            <div class="sop-name">${item.name}</div>
            <div class="sop-desc">${item.sop}</div>
          </div>
        </div>
      `;
    });
    html += `</div></div>`;
  });

  container.innerHTML = html;
  container.querySelectorAll('.sop-item').forEach(el => {
    el.addEventListener('click', () => {
      goTo(parseInt(el.dataset.idx));
    });
  });
}

// Load current step
function loadStep(idx) {
  currentStep = idx;
  const item = flow[idx];
  document.getElementById('frame').src = item.file;
  document.getElementById('overlayText').textContent = `录制中 · ${item.sop}`;
  document.getElementById('progressFill').style.width = `${((idx + 1) / flow.length) * 100}%`;
  document.getElementById('progressText').textContent = `${idx + 1} / ${flow.length}`;
  document.getElementById('prevBtn').disabled = idx === 0;
  document.getElementById('nextBtn').disabled = idx === flow.length - 1;
  renderSidebar();
  stepStartTime = Date.now();
}

// Navigation
function goTo(idx) {
  if (idx < 0 || idx >= flow.length) return;
  loadStep(idx);
  startStepTimer();
}

function next() {
  if (currentStep < flow.length - 1) {
    loadStep(currentStep + 1);
    startStepTimer();
  } else {
    playing = false;
    document.getElementById('playBtn').textContent = '▶ 播放';
  }
}

function prev() {
  if (currentStep > 0) {
    loadStep(currentStep - 1);
    startStepTimer();
  }
}

function togglePlay() {
  playing = !playing;
  document.getElementById('playBtn').textContent = playing ? '⏸ 暂停' : '▶ 播放';
  document.getElementById('autoBadge').textContent = playing ? '▶ 自动播放' : '⏸ 已暂停';
  if (playing) {
    startStepTimer();
  } else {
    clearTimeout(stepTimer);
  }
}

// Auto play timer - uses per-step duration if available
function startStepTimer() {
  clearTimeout(stepTimer);
  if (!playing) return;
  const dur = flow[currentStep].stepDur || DEFAULT_STEP_DUR;
  stepTimer = setTimeout(() => {
    next();
  }, dur);
}

// Update timer display
setInterval(() => {
  if (playing) {
    const dur = flow[currentStep].stepDur || DEFAULT_STEP_DUR;
    const elapsed = Date.now() - stepStartTime;
    const remaining = Math.max(0, dur - elapsed);
    const seconds = Math.floor(remaining / 1000);
    document.getElementById('timeText').textContent = `00:${String(seconds).padStart(2, '0')}`;
  }
}, 100);

// Button handlers
document.getElementById('prevBtn').addEventListener('click', prev);
document.getElementById('nextBtn').addEventListener('click', next);
document.getElementById('playBtn').addEventListener('click', togglePlay);

// Speed selector - sets baseline duration (for non-custom steps)
document.getElementById('speedSelect').addEventListener('change', (e) => {
  DEFAULT_STEP_DUR = parseInt(e.target.value);
  startStepTimer(); // restart with new speed
});

// Keyboard shortcuts
document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowRight') next();
  else if (e.key === 'ArrowLeft') prev();
  else if (e.key === ' ') { e.preventDefault(); togglePlay(); }
});

// Initial load
loadStep(0);
startStepTimer();
</script>

</body>
</html>
