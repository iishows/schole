<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>小诺学伴 · 管理员后台</title>
<style>
  :root {
    --primary: #1e293b; --primary-soft: #e0e7ff;
    --bg: #0f172a; --surface: #1e293b; --surface-2: #334155;
    --fg: #f1f5f9; --muted: #94a3b8; --line: #334155;
    --accent: #3b82f6; --danger: #ef4444; --success: #10b981;
    --warn: #f59e0b;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, system-ui, sans-serif; background: var(--bg); color: var(--fg); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .anno { background: #fef3c7; border: 1px dashed #f59e0b; border-radius: 8px; padding: 8px 12px; margin-bottom: 16px; font-size: 11px; color: #854d0e; }
  .login-card { background: var(--surface); border-radius: 12px; padding: 32px; width: 100%; max-width: 380px; border: 1px solid var(--line); }
  .logo { display: flex; align-items: center; gap: 12px; margin-bottom: 24px; }
  .logo-icon { width: 40px; height: 40px; background: var(--accent); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 20px; }
  .logo-title { font-size: 16px; font-weight: 700; }
  .logo-sub { font-size: 11px; color: var(--muted); }
  .row { margin-bottom: 14px; }
  .label { font-size: 12px; color: var(--muted); margin-bottom: 6px; display: block; }
  .input { width: 100%; padding: 11px 14px; border: 1px solid var(--line); border-radius: 8px; font-size: 14px; background: var(--bg); color: var(--fg); outline: none; font-family: inherit; }
  .input:focus { border-color: var(--accent); }
  .input.code { font-family: monospace; letter-spacing: 4px; text-align: center; font-size: 18px; }
  .captcha { display: flex; gap: 8px; align-items: center; }
  .captcha-img { width: 80px; height: 38px; background: repeating-linear-gradient(45deg, #334155, #334155 4px, #475569 4px, #475569 8px); border-radius: 6px; display: flex; align-items: center; justify-content: center; color: #fbbf24; font-weight: 700; font-size: 14px; letter-spacing: 2px; }
  .checkbox-row { display: flex; align-items: center; gap: 6px; margin-bottom: 16px; font-size: 12px; color: var(--muted); }
  .checkbox { width: 16px; height: 16px; }
  .btn { width: 100%; padding: 13px; background: var(--accent); color: #fff; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; }
  .footer { text-align: center; margin-top: 14px; font-size: 11px; color: var(--muted); }
  .footer a { color: var(--accent); text-decoration: none; }
</style>
</head>
<body>
<div>
  <div class="anno">🔐 O-1 · 管理员后台登录 · 内部账号</div>
  <div class="login-card">
    <div class="logo">
      <div class="logo-icon">⚙️</div>
      <div>
        <div class="logo-title">小诺学伴 · 管理后台</div>
        <div class="logo-sub">OpenMAIC Operator Console</div>
      </div>
    </div>
    <div class="row">
      <label class="label">账号</label>
      <input class="input" placeholder="op-001" value="op-001" />
    </div>
    <div class="row">
      <label class="label">密码</label>
      <input type="password" class="input" value="••••••••" />
    </div>
    <div class="row">
      <label class="label">两步验证</label>
      <div class="captcha">
        <input class="input code" placeholder="6 位" value="846213" />
        <div class="captcha-img">8G4K2</div>
      </div>
    </div>
    <div class="checkbox-row">
      <input type="checkbox" class="checkbox" checked />
      <span>7 天内自动登录（仅信任设备）</span>
    </div>
    <button class="btn">🔐 登录</button>
    <div class="footer">仅限授权运营人员 · <a href="#">忘记密码？</a></div>
  </div>
</div>
</body>
</html>
