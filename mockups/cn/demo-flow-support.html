<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>小诺学伴 · 客服端 SOP 演示</title>
<style>
  :root {
    --role: #f59e0b;
    --role-soft: #fef3c7;
    --bg: #1f1505;
    --surface: #2d200a;
    --surface-2: #3d2a0e;
    --fg: #f5f3ff;
    --muted: #c5b89a;
    --line: #4d3614;
    --success: #10b981;
    --warn: #f59e0b;
    --danger: #ef4444;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    background: var(--bg);
    color: var(--fg);
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }

  .app { display: grid; grid-template-columns: 320px 1fr; grid-template-rows: 60px 1fr 60px; height: 100vh; }

  .header {
    grid-column: 1 / -1;
    background: linear-gradient(90deg, #d97706 0%, #f59e0b 50%, #fbbf24 100%);
    padding: 0 20px;
    display: flex; align-items: center; gap: 16px;
  }
  .header-title { font-size: 16px; font-weight: 700; color: #1a1505; }
  .header-sub { font-size: 12px; opacity: 0.7; color: #1a1505; }
  .header-spacer { flex: 1; }
  .header-meta {
    font-size: 12px;
    background: rgba(26,21,5,0.15);
    color: #1a1505;
    padding: 4px 12px; border-radius: 999px; font-weight: 600;
  }

  .sidebar {
    background: var(--surface); border-right: 1px solid var(--line);
    overflow-y: auto; padding: 16px 12px;
  }
  .sidebar-title {
    font-size: 11px; font-weight: 700; color: var(--muted);
    text-transform: uppercase; letter-spacing: 1px;
    margin-bottom: 12px; padding: 0 4px;
  }
  .sop-group { margin-bottom: 14px; }
  .sop-group-title {
    font-size: 11px; font-weight: 700; color: var(--role);
    padding: 6px 8px; margin-bottom: 4px;
    border-left: 2px solid var(--role);
  }
  .sop-list { display: flex; flex-direction: column; gap: 4px; }
  .sop-item {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 10px; border-radius: 6px;
    cursor: pointer; transition: all 0.15s; color: var(--fg);
    border: 1px solid transparent; font-size: 12px;
  }
  .sop-item:hover { background: var(--surface-2); }
  .sop-item.active {
    background: linear-gradient(135deg, #d97706 0%, #fbbf24 100%);
    color: #1a1505; border-color: rgba(0,0,0,0.1);
  }
  .sop-num {
    width: 20px; height: 20px; border-radius: 50%;
    background: rgba(255,255,255,0.1);
    display: flex; align-items: center; justify-content: center;
    font-size: 10px; font-weight: 700; flex-shrink: 0;
  }
  .sop-item.active .sop-num { background: rgba(0,0,0,0.2); color: #fff; }
  .sop-item.done .sop-num { background: var(--success); color: #fff; }
  .sop-info { flex: 1; min-width: 0; }
  .sop-name {
    font-size: 12px; font-weight: 500;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .sop-desc {
    font-size: 10px; opacity: 0.7; margin-top: 1px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  .main { background: #fef3c7; position: relative; overflow: hidden; }
  .iframe-frame { width: 100%; height: 100%; border: none; background: #fef3c7; }
  .iframe-overlay {
    position: absolute;
    top: 12px; left: 12px;
    background: rgba(31,21,5,0.92);
    backdrop-filter: blur(10px);
    color: #fff; padding: 6px 14px;
    border-radius: 999px; font-size: 12px; font-weight: 600;
    pointer-events: none; z-index: 10;
    display: flex; align-items: center; gap: 8px;
  }
  .overlay-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--danger); animation: pulse 1.5s infinite;
  }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

  .controls {
    grid-column: 1 / -1;
    background: var(--surface); border-top: 1px solid var(--line);
    padding: 0 20px; display: flex; align-items: center; gap: 12px;
  }
  .ctrl-btn {
    padding: 8px 14px; background: var(--surface-2); color: var(--fg);
    border: 1px solid var(--line); border-radius: 8px;
    font-size: 13px; font-weight: 600; cursor: pointer;
  }
  .ctrl-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .ctrl-btn-primary {
    background: linear-gradient(135deg, #d97706 0%, #fbbf24 100%);
    color: #1a1505; border: none;
  }
  .ctrl-progress { flex: 1; display: flex; align-items: center; gap: 12px; }
  .ctrl-progress-bar { flex: 1; height: 6px; background: var(--surface-2); border-radius: 3px; overflow: hidden; }
  .ctrl-progress-fill {
    height: 100%;
    background: linear-gradient(90deg, #d97706 0%, #f59e0b 50%, #fbbf24 100%);
    transition: width 0.3s;
  }
  .ctrl-progress-text {
    font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums;
  }
  .ctrl-time {
    font-size: 12px; color: var(--muted); font-family: monospace;
    font-variant-numeric: tabular-nums; min-width: 60px;
  }
  .role-pill {
    padding: 4px 12px;
    background: rgba(26,21,5,0.85);
    color: #fbbf24;
    border-radius: 999px;
    font-size: 11px; font-weight: 700;
  }
</style>
</head>
<body>

<div class="app">

  <div class="header">
    <span class="role-pill">🛡️ 客服端</span>
    <div class="header-title">客服 / 合规 SOP 演示</div>
    <div class="header-sub">3 mockup · 投诉 / 未成年保护 / 通用错误</div>
    <div class="header-spacer"></div>
    <div class="header-meta" id="autoBadge">▶ 自动播放</div>
  </div>

  <div class="sidebar">
    <div class="sidebar-title">客服 SOP 流程</div>
    <div id="sopList"></div>
  </div>

  <div class="main">
    <div class="iframe-overlay">
      <span class="overlay-dot"></span>
      <span id="overlayText">录制中 · 客服端</span>
    </div>
    <iframe class="iframe-frame" id="frame" src=""></iframe>
  </div>

  <div class="controls">
    <button class="ctrl-btn" id="prevBtn">← 上一步</button>
    <button class="ctrl-btn ctrl-btn-primary" id="playBtn">⏸ 暂停</button>
    <button class="ctrl-btn" id="nextBtn">下一步 →</button>
    <div class="ctrl-progress">
      <div class="ctrl-progress-bar">
        <div class="ctrl-progress-fill" id="progressFill" style="width: 0%;"></div>
      </div>
      <div class="ctrl-progress-text" id="progressText">1 / 3</div>
    </div>
    <div class="ctrl-time" id="timeText">00:00</div>
  </div>

</div>

<script>
// 客服端 3 步 SOP 流程
const flow = [
  { id: 1, sop: 'SOP 9 投诉', group: '合规 · 客服', file: 'complaint.html', name: '投诉 / 申诉', desc: '6 类型 + SLA 24/48/72h' },
  { id: 2, sop: 'SOP 10 未成年保护', group: '合规 · 客服', file: 'minor-protection.html', name: '未成年保护', desc: '≤60min + 21:00-7:00 禁用' },
  { id: 3, sop: '通用错误页', group: '通用', file: '404.html', name: '404 错误页', desc: '返回首页' },
];

const STEP_DUR = 5000;
let currentStep = 0;
let playing = true;
let stepStartTime = 0;
let stepTimer = null;

function renderSidebar() {
  const container = document.getElementById('sopList');
  container.innerHTML = flow.map((item, i) => `
    <div class="sop-item ${i === currentStep ? 'active' : i < currentStep ? 'done' : ''}" data-idx="${i}">
      <div class="sop-num">${item.id}</div>
      <div class="sop-info">
        <div class="sop-name">${item.name}</div>
        <div class="sop-desc">${item.sop}</div>
      </div>
    </div>
  `).join('');
  container.querySelectorAll('.sop-item').forEach(el => {
    el.addEventListener('click', () => goTo(parseInt(el.dataset.idx)));
  });
}

function loadStep(idx) {
  currentStep = idx;
  const item = flow[idx];
  document.getElementById('frame').src = item.file;
  document.getElementById('overlayText').textContent = `录制中 · ${item.sop}`;
  document.getElementById('progressFill').style.width = `${((idx + 1) / flow.length) * 100}%`;
  document.getElementById('progressText').textContent = `${idx + 1} / ${flow.length}`;
  document.getElementById('prevBtn').disabled = idx === 0;
  document.getElementById('nextBtn').disabled = idx === flow.length - 1;
  renderSidebar();
  stepStartTime = Date.now();
}

function goTo(idx) {
  if (idx < 0 || idx >= flow.length) return;
  loadStep(idx);
  startStepTimer();
}

function next() {
  if (currentStep < flow.length - 1) {
    loadStep(currentStep + 1);
    startStepTimer();
  } else {
    playing = false;
    document.getElementById('playBtn').textContent = '▶ 播放';
  }
}

function prev() {
  if (currentStep > 0) {
    loadStep(currentStep - 1);
    startStepTimer();
  }
}

function togglePlay() {
  playing = !playing;
  document.getElementById('playBtn').textContent = playing ? '⏸ 暂停' : '▶ 播放';
  document.getElementById('autoBadge').textContent = playing ? '▶ 自动播放' : '⏸ 已暂停';
  if (playing) startStepTimer(); else clearTimeout(stepTimer);
}

function startStepTimer() {
  clearTimeout(stepTimer);
  if (!playing) return;
  stepTimer = setTimeout(() => next(), STEP_DUR);
}

setInterval(() => {
  if (playing) {
    const remaining = Math.max(0, STEP_DUR - (Date.now() - stepStartTime));
    document.getElementById('timeText').textContent = `00:${String(Math.floor(remaining / 1000)).padStart(2, '0')}`;
  }
}, 100);

document.getElementById('prevBtn').addEventListener('click', prev);
document.getElementById('nextBtn').addEventListener('click', next);
document.getElementById('playBtn').addEventListener('click', togglePlay);

document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowRight') next();
  else if (e.key === 'ArrowLeft') prev();
  else if (e.key === ' ') { e.preventDefault(); togglePlay(); }
});

loadStep(0);
startStepTimer();
</script>

</body>
</html>
