<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>小诺学伴 · 今日复习</title>
<style>
  :root {
    --primary: #722ed1; --primary-soft: #f3ebfd;
    --bg: #faf9fe; --surface: #fff;
    --fg: #1f1d2e; --muted: #6b6884; --line: #ece9f5;
    --success: #10b981; --success-soft: #d1fae5;
    --warn: #f59e0b; --warn-soft: #fef3c7;
    --nunu: #722ed1; --hong: #ec4899; --aze: #f59e0b;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, system-ui, sans-serif; background: var(--bg); padding-bottom: 80px; min-height: 100vh; }
  .topbar { background: linear-gradient(135deg, var(--primary) 0%, #a855f7 100%); color: #fff; padding: 14px 20px; display: flex; align-items: center; gap: 12px; }
  .back { font-size: 20px; cursor: pointer; }
  .title { font-size: 16px; font-weight: 600; flex: 1; }
  .badge { padding: 2px 10px; background: rgba(255,255,255,0.2); border-radius: 999px; font-size: 11px; font-weight: 600; }
  .anno { background: #fef3c7; border: 1px dashed #facc15; border-radius: 8px; padding: 8px 12px; margin: 12px; font-size: 11px; color: #854d0e; }
  .main { max-width: 720px; margin: 0 auto; padding: 0 12px; }
  .hero { background: linear-gradient(135deg, var(--primary) 0%, #a855f7 100%); color: #fff; border-radius: 16px; padding: 24px; text-align: center; margin-bottom: 16px; }
  .hero-num { font-size: 56px; font-weight: 700; line-height: 1; }
  .hero-num .small { font-size: 18px; opacity: 0.85; font-weight: 400; }
  .hero-label { font-size: 13px; opacity: 0.9; margin-top: 4px; }
  .progress-row { margin-top: 16px; }
  .progress-text { font-size: 12px; opacity: 0.85; margin-bottom: 4px; }
  .progress-bar { height: 6px; background: rgba(255,255,255,0.2); border-radius: 3px; overflow: hidden; }
  .progress-fill { height: 100%; background: linear-gradient(90deg, #fbbf24 0%, #f59e0b 100%); border-radius: 3px; width: 0%; }

  .section-title { font-size: 13px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin: 16px 0 10px; padding: 0 4px; display: flex; align-items: center; gap: 6px; }
  .section-title .count { padding: 1px 8px; background: var(--warn-soft); color: #92400e; border-radius: 999px; font-size: 11px; }

  .review-list { display: flex; flex-direction: column; gap: 8px; }
  .review-item { background: var(--surface); border-radius: 14px; padding: 14px; border: 2px solid transparent; cursor: pointer; transition: all 0.15s; }
  .review-item:hover { border-color: var(--primary); transform: translateY(-1px); }
  .review-item.priority { border-color: var(--warn); background: linear-gradient(180deg, #fffbeb 0%, var(--surface) 60%); }
  .review-top { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
  .review-num { width: 28px; height: 28px; border-radius: 50%; background: var(--primary); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px; flex-shrink: 0; }
  .review-item.priority .review-num { background: var(--warn); }
  .review-title { flex: 1; font-size: 14.5px; font-weight: 600; }
  .review-meta { display: flex; gap: 6px; font-size: 11px; color: var(--muted); }
  .review-tag { padding: 1px 6px; background: var(--bg); border-radius: 4px; }
  .review-action { padding: 6px 12px; background: var(--primary); color: #fff; border: none; border-radius: 8px; font-size: 12px; font-weight: 600; cursor: pointer; }
  .review-item.priority .review-action { background: var(--warn); }

  .info-card { background: var(--primary-soft); border-radius: 12px; padding: 14px; margin-top: 12px; display: flex; gap: 10px; align-items: center; }
  .info-card-icon { font-size: 24px; }
  .info-card-text { flex: 1; font-size: 12px; color: #4c1d95; line-height: 1.6; }

  .btn-all { width: 100%; padding: 14px; background: var(--primary); color: #fff; border: none; border-radius: 12px; font-size: 15px; font-weight: 600; cursor: pointer; margin-top: 16px; }
</style>
</head>
<body>
<div class="topbar">
  <span class="back">←</span>
  <span class="title">今日复习</span>
  <span class="badge">📚 大宝</span>
</div>

<div class="anno">🔁 K-5 · M9 间隔重复调度 · 艾宾浩斯 1/3/7/14 天</div>

<div class="main">

  <!-- Hero -->
  <div class="hero">
    <div class="hero-num">3<span class="small"> 道</span></div>
    <div class="hero-label">今日待复习 · 约 15 分钟</div>
    <div class="progress-row">
      <div class="progress-text">艾宾浩斯曲线进度 · 已掌握 12 / 共 17</div>
      <div class="progress-bar"><div class="progress-fill" style="width: 70%;"></div></div>
    </div>
  </div>

  <!-- Review list -->
  <div class="section-title">
    🔥 今日优先 <span class="count">3</span>
  </div>
  <div class="review-list">

    <div class="review-item priority">
      <div class="review-top">
        <div class="review-num">1</div>
        <div class="review-title">形近字辨析</div>
        <button class="review-action">开始 →</button>
      </div>
      <div class="review-meta">
        <span class="review-tag">语文</span>
        <span class="review-tag">📅 今天复习</span>
        <span class="review-tag">第 1 轮</span>
      </div>
    </div>

    <div class="review-item">
      <div class="review-top">
        <div class="review-num">2</div>
        <div class="review-title">异分母分数加法</div>
        <button class="review-action">开始 →</button>
      </div>
      <div class="review-meta">
        <span class="review-tag">4-NF-A-2</span>
        <span class="review-tag">📅 1 天后</span>
        <span class="review-tag">第 2 轮</span>
      </div>
    </div>

    <div class="review-item">
      <div class="review-top">
        <div class="review-num">3</div>
        <div class="review-title">应用题单位换算</div>
        <button class="review-action">开始 →</button>
      </div>
      <div class="review-meta">
        <span class="review-tag">4-MD-A-1</span>
        <span class="review-tag">📅 3 天后</span>
        <span class="review-tag">第 2 轮</span>
      </div>
    </div>

  </div>

  <!-- 已掌握 -->
  <div class="section-title">✅ 已掌握</div>
  <div class="review-list">
    <div class="review-item" style="opacity: 0.6;">
      <div class="review-top">
        <div class="review-num" style="background: var(--success);">✓</div>
        <div class="review-title" style="text-decoration: line-through;">同分母分数加法</div>
        <span style="font-size: 11px; color: var(--success);">已掌握</span>
      </div>
      <div class="review-meta">
        <span class="review-tag">4-NF-A-1</span>
        <span class="review-tag">5 天前</span>
      </div>
    </div>
  </div>

  <!-- Info -->
  <div class="info-card">
    <div class="info-card-icon">💡</div>
    <div class="info-card-text">
      <strong>间隔重复</strong>：根据艾宾浩斯曲线，错题在 1/3/7/14 天后自动复习。
      答对 4 轮后标记为"已掌握"。
    </div>
  </div>

  <button class="btn-all">📝 开始全部复习</button>

</div>

</body>
</html>
